<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="app-favicon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HostMaster Pro - Hosting Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--font-primary)', 'sans-serif'], // Dynamic font
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              primary: 'var(--color-primary)', 
              secondary: 'var(--color-secondary)',
              // Map standard indigo classes to our dynamic variables to apply theming globally
              indigo: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: 'var(--color-primary)',       // Override standard indigo-600
                700: 'var(--color-primary-hover)', // Override standard indigo-700
                800: '#3730a3',
                900: '#312e81',
              },
              slate: {
                850: '#151e2e', 
                900: '#0f172a',
              }
            },
            borderRadius: {
              'lg': 'var(--ui-radius)', // Remap common rounded classes
              'xl': 'var(--ui-radius)',
              '2xl': 'calc(var(--ui-radius) + 4px)',
            },
            borderWidth: {
              'btn': 'var(--ui-btn-border)',
            },
            boxShadow: {
              'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)',
              'glow': '0 0 15px rgba(79, 70, 229, 0.15)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Defaults (Overridden by AuthContext) */
        --color-primary: #4f46e5; 
        --color-primary-hover: #4338ca;
        --color-disabled: #94a3b8;
        --color-secondary: #64748b;
        --font-primary: 'Plus Jakarta Sans';
        --ui-radius: 0.75rem; 
        --ui-btn-border: 0px;
        --ui-font-scale: 1;
      }
      
      html {
        font-size: calc(16px * var(--ui-font-scale)); /* Scale base font size */
      }

      body {
        font-family: var(--font-primary), sans-serif;
        background-color: #f3f4f6; 
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Global Button Override for consistency */
      button:disabled {
        background-color: var(--color-disabled) !important;
        opacity: 0.7;
        cursor: not-allowed;
      }
      
      /* Apply dynamic border width to buttons using standard classes */
      button[class*="bg-indigo-600"], 
      button[class*="bg-primary"] {
        border-width: var(--ui-btn-border);
        border-color: rgba(255,255,255,0.2); 
      }

      /* Refined Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Hide Scrollbar Utility */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Animation Utilities */
      .animate-fade-in-up {
        animation: fadeInUp 0.4s ease-out forwards;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      .animate-blob {
        animation: blob 7s infinite;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      /* Success Checkmark Animation */
      .checkmark-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      .checkmark-svg {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: block;
        stroke-width: 2;
        stroke: #fff;
        stroke-miterlimit: 10;
        box-shadow: inset 0px 0px 0px #16a34a; 
        animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
      }
      
      .checkmark-circle {
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        stroke-width: 2;
        stroke-miterlimit: 10;
        stroke: #16a34a; 
        fill: none;
        animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      }
      
      .checkmark-check {
        transform-origin: 50% 50%;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
      }
      
      @keyframes stroke {
        100% { stroke-dashoffset: 0; }
      }
      
      @keyframes scale {
        0%, 100% { transform: none; }
        50% { transform: scale3d(1.1, 1.1, 1); }
      }
      
      @keyframes fill {
        100% { box-shadow: inset 0px 0px 0px 30px #16a34a; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "vite": "https://esm.sh/vite@^7.3.0",

    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "jspdf": "https://esm.sh/jspdf@^3.0.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "@emailjs/browser": "https://esm.sh/@emailjs/browser@^4.4.1"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
